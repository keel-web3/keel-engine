<!doctype html>
<meta charset="utf-8">
<title>KEEL import</title>
<style>body{margin:0;background:#0c0d10;color:#cfd3e6;font:12px ui-monospace,monospace;padding:10px}h3{margin:14px 0 6px;font-weight:normal;color:#8f94ad}canvas{display:block;image-rendering:pixelated;max-width:100%}pre{white-space:pre-wrap}</style>
<b>KEEL import</b>: 3D files (written here) -> voxels -> parts -> body and worn attributes -> fitted primitives, walking on the engine's animator; the op list replaying live. Build first: <code>node packages/import/tools/build.mjs</code>.
<pre id="status">importing...</pre>
<div id="out"></div>
<script type="module">
  import "./dist/import.js";
  const status = document.getElementById("status");
  try {
    const r = await globalThis.importPage(document.getElementById("out"));
    globalThis.importReport = r;
    status.textContent = JSON.stringify(r, null, 1);
  } catch (e) { status.textContent = String(e && e.stack || e); globalThis.importError = String(e && e.stack || e); }
</script>
