<!doctype html>
<meta charset="utf-8">
<title>KEEL builder</title>
<style>body{margin:0;background:#0c0d10;color:#cfd3e6;font:12px ui-monospace,monospace;padding:10px}h3{margin:14px 0 6px;font-weight:normal;color:#8f94ad}canvas{display:block;image-rendering:pixelated;max-width:100%}pre{white-space:pre-wrap}</style>
<b>KEEL builder</b>: voxels -> engine parts through the pixel renderer; a rigged voxel creature on the engine's animator; things that move by themselves. Build first: <code>node packages/builder/tools/build.mjs</code>.
<pre id="status">building...</pre>
<div id="out"></div>
<script type="module">
  import "./dist/builder.js";
  const status = document.getElementById("status");
  try {
    const r = await globalThis.builderPage(document.getElementById("out"));
    globalThis.builderReport = r;
    status.textContent = JSON.stringify(r, null, 1);
  } catch (e) { status.textContent = String(e && e.stack || e); globalThis.builderError = String(e && e.stack || e); }
</script>
