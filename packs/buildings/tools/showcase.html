<!doctype html>
<meta charset="utf-8">
<title>KEEL world content</title>
<style>body{margin:0;background:#0c0d10;color:#cfd3e6;font:12px ui-monospace,monospace;padding:10px}h3{margin:14px 0 6px;font-weight:normal;color:#8f94ad}canvas{display:block;image-rendering:pixelated;max-width:100%}pre{white-space:pre-wrap}</style>
<b>KEEL world content</b>: packs/foliage and packs/buildings in the pixel and voxel styles, the wind, a bridge over water, a village. Build first: <code>node packs/buildings/tools/build.mjs</code>. <code>?only=foliage|buildings|wind|bridge|village</code>, <code>?save=0</code> not to write out/.
<pre id="status">building...</pre>
<div id="out"></div>
<script type="module">
  import "./dist/showcase.js";
  const status = document.getElementById("status");
  try {
    const r = await globalThis.showcasePage(document.getElementById("out"), new URLSearchParams(location.search));
    globalThis.showcaseReport = r;
    status.textContent = JSON.stringify(r, null, 1);
  } catch (e) { status.textContent = String(e && e.stack || e); globalThis.showcaseError = String(e && e.stack || e); }
</script>
